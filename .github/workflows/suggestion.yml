name: Process Issue Suggestion

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  process-suggestion:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, '[')
    concurrency:
      group: suggestion-process-${{ github.event.issue.number }}
      cancel-in-progress: false

    steps:
      - name: Apply labels and comment
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title;
            const match = title.match(/^\[([^\]]+)\]/);
            if (!match) return;

            const entityLabel = match[1].toLowerCase();
            const labels = ['suggestion', entityLabel];

            async function ensureLabel(labelName, color) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: labelName,
                    color,
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                }
              }
            }

            for (const labelName of labels) {
              await ensureLabel(
                labelName,
                labelName === 'suggestion' ? '0e8a16' : '5319e7'
              );
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels,
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `**Thanks for your suggestion!**`,
                ``,
                `Your issue has been labeled and will be reviewed by a maintainer.`
              ].join('\n')
            });
