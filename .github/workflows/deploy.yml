name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [data-updated]
  workflow_dispatch:
    inputs:
      data_branch:
        description: Branch of dragon-traveler-data to fetch
        default: main
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: zhenga8533/dragon-traveler-data
          token: ${{ secrets.PAT }}
          ref: ${{ github.event.inputs.data_branch || 'main' }}
          path: private-data

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --ignore-scripts
        env:
          DATA_DIR: private-data/data
          VITE_APP_BASE: /
          VITE_ASSETS_BASE: ${{ vars.R2_PUBLIC_URL }}

      - name: Copy data into dist
        run: cp -r private-data/data dist/data

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
